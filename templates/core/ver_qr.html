<!DOCTYPE html>
<html lang="es">
<head>
    <title>Imprimir GiftCard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        /* Estilos específicos para impresión */
        @media print {
            .no-print { display: none !important; }
            body { background: white; }
            .card-print { border: 2px solid #000; padding: 20px; text-align: center; page-break-inside: avoid; }
        }
    </style>
</head>
<body class="bg-light text-center p-5">

    <div class="container d-flex justify-content-center">
        <div class="card card-print shadow-sm" style="width: 350px;">
            <div class="card-body">
                <h3 class="card-title fw-bold">GIFTCARD</h3>
                <p class="text-muted">Establecimiento Oficial</p>
                
                <img src="{{ tarjeta.qr_image.url }}" alt="QR Code" class="img-fluid my-3" style="width: 200px;">
                
                <h2 class="text-success fw-bold">Q{{ tarjeta.saldo }}</h2>
                <small class="text-muted d-block mt-2">ID: {{ tarjeta.id }}</small>
                {% if tarjeta.fecha_vencimiento %}
                    <small class="text-danger">Vence: {{ tarjeta.fecha_vencimiento }}</small>
                {% endif %}
            </div>
        </div>
    </div>

    <div class="mt-4 no-print">
        <button onclick="window.print()" class="btn btn-dark btn-lg me-2">🖨️ IMPRIMIR</button>
        <a href="{% url 'crear_card' %}" class="btn btn-primary btn-lg">Crear Otra</a>
        <br><br>
        <a href="{% url 'dashboard' %}" class="text-muted">Ir al Dashboard</a>
    </div>

</body>
</html>
