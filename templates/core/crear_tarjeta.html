{% extends 'base.html' %}

{% block title %}Emitir Nueva Tarjeta{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8 col-lg-6">
        <div class="card shadow">
            <div class="card-header bg-dark text-white">
                <h4 class="mb-0">Generar Nueva Tarjeta</h4>
            </div>
            <div class="card-body p-4">
                <form method="post">
                    {% csrf_token %}
                    {% for field in form %}
                        <div class="mb-3">
                            <label class="form-label fw-bold">{{ field.label }}</label>
                            {{ field }}
                            {% if field.help_text %}
                                <div class="form-text">{{ field.help_text }}</div>
                            {% endif %}
                        </div>
                    {% endfor %}
                    
                    <div class="d-grid gap-2 mt-4">
                        <button type="submit" class="btn btn-primary btn-lg">GENERAR TARJETA</button>
                        <a href="{% url 'dashboard' %}" class="btn btn-outline-secondary">Volver al Menu</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
