<!DOCTYPE html>
<html lang="es">
<head>
    <title>Cambiar PIN</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center justify-content-center vh-100">

    <div class="card shadow p-4" style="width: 400px;">
        <h4 class="mb-3 text-center">Cambiar PIN de Seguridad</h4>
        <p class="text-center text-muted small">Tarjeta terminada en: ...{{ tarjeta.id|stringformat:"s"|slice:"-8:" }}</p>
        
        <form method="post">
            {% csrf_token %}
            <div class="mb-3">
                <label class="form-label">Nuevo PIN</label>
                <input type="text" name="nuevo_pin" class="form-control text-center fs-3 letter-spacing-2" 
                       maxlength="4" pattern="\d{4}" placeholder="0000" required>
            </div>
            
            <div class="d-grid gap-2">
                <button type="submit" class="btn btn-warning">💾 Guardar Nuevo PIN</button>
                <a href="{% url 'lista_tarjetas' %}" class="btn btn-link text-secondary">Cancelar</a>
            </div>
        </form>
    </div>

</body>
</html>
