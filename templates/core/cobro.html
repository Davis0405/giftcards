<div class="card border-primary mb-3">
    <div class="card-header bg-primary text-white">Validar Pago</div>
    <div class="card-body text-center">
        <h5 class="card-title">Saldo Disponible</h5>
        <h1 class="display-4 text-success">Q{{ tarjeta.saldo }}</h1>
        <p class="text-muted">ID: {{ tarjeta.id }}</p>

        <hr>

        <form method="post">
            {% csrf_token %}
            <input type="hidden" name="uuid" value="{{ tarjeta.id }}">
            <div class="mb-3">
                <label class="form-label">Monto a Cobrar</label>
                <input type="number" step="0.01" name="monto" class="form-control form-control-lg" placeholder="0.00" required>
            </div>
            <div class="d-grid gap-2">
                <button type="submit" class="btn btn-success btn-lg">CONFIRMAR PAGO</button>
                <a href="{% url 'dashboard' %}" class="btn btn-secondary">Cancelar</a>
            </div>
        </form>
    </div>
</div>
