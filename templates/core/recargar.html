{% extends 'base.html' %}

{% block title %}Recargar Saldo{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8 col-lg-5">
        <div class="card border-success shadow-lg">
            <div class="card-header bg-success text-white text-center py-3">
                <h4 class="mb-0">RECARGAR TARJETA</h4>
            </div>
            
            <div class="card-body text-center p-4">
                <p class="text-muted">Saldo Actual</p>
                <h2 class="text-success">Q{{ tarjeta.saldo }}</h2>
                <small class="text-muted font-monospace">{{ tarjeta.id }}</small>
                
                <hr>
                
                <form method="post">
                    {% csrf_token %}
                    <input type="hidden" name="uuid" value="{{ tarjeta.id }}">
                    
                    <div class="mb-4 text-start">
                        <label class="form-label fw-bold">Monto a Ingresar (Efectivo)</label>
                        <div class="input-group input-group-lg">
                            <span class="input-group-text bg-light text-success fw-bold">+Q</span>
                            <input type="number" step="0.01" name="monto" class="form-control border-success fw-bold" placeholder="0.00" required>
                        </div>
                    </div>

                    <div class="d-grid gap-2">
                        <button type="submit" class="btn btn-success w-100 btn-lg fw-bold">CONFIRMAR RECARGA</button>
                        <a href="{% url 'terminal' %}" class="btn btn-outline-secondary">Cancelar</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
