<!DOCTYPE html>
<html lang="es">
<head>
    <title>Recargar Saldo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light p-5">
    <div class="container" style="max-width: 500px;">
        <div class="card border-success shadow">
            <div class="card-header bg-success text-white">
                <h4>RECARGAR TARJETA</h4>
            </div>
            <div class="card-body text-center">
                <p>Saldo Actual:</p>
                <h2 class="text-success">Q{{ tarjeta.saldo }}</h2>
                <small class="text-muted">{{ tarjeta.id }}</small>
                
                <hr>
                
                <form method="post">
                    {% csrf_token %}
                    <input type="hidden" name="uuid" value="{{ tarjeta.id }}">
                    
                    <div class="mb-3">
                        <label class="form-label fw-bold">Monto a Ingresar (Efectivo Recibido)</label>
                        <input type="number" step="0.01" name="monto" class="form-control form-control-lg border-success" placeholder="Q 0.00" required>
                    </div>

                    <button type="submit" class="btn btn-success w-100 btn-lg">CONFIRMAR RECARGA</button>
                </form>
                
                <a href="{% url 'dashboard' %}" class="btn btn-link mt-3 text-secondary">Cancelar</a>
            </div>
        </div>
    </div>
</body>
</html>
